<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14">
  <title>US Speed Limit Map</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="vendor/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>

  <details id="panel" open>
    <summary>Speed limit (mph)</summary>
    <div class="seg" role="group" aria-label="Mode">
      <button type="button" data-mode="speed" aria-pressed="true">Speed map</button>
      <button type="button" data-mode="fix" aria-pressed="false" title="Highlight roads that may need fixing in OpenStreetMap">Fix-it mode</button>
    </div>
    <label class="row">Map <select id="basemap" aria-label="Basemap"></select></label>
    <div id="legend"></div>
    <p class="note" id="note"></p>
    <div id="speed-options">
      <label><input type="checkbox" id="toggle-unknown" checked> Show roads with no speed data</label>
    </div>
    <label><input type="checkbox" id="toggle-shields" checked> Show route signs</label>
    <select id="bookmarks" aria-label="Jump to place" hidden></select>
  </details>

  <div id="status" role="status" hidden></div>

  <script src="vendor/maplibre-gl.js"></script>
  <script src="vendor/pmtiles.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
