<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14">
  <title>US Speed Limit Map</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="vendor/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>

  <details id="panel" open>
    <summary>Speed limit (mph)</summary>
    <label class="row">Map <select id="basemap" aria-label="Basemap"></select></label>
    <ul id="legend"></ul>
    <p class="note">Line width = number of lanes tagged in OpenStreetMap. Signs show the route (Interstate, US, state).</p>
    <label><input type="checkbox" id="toggle-unknown" checked> Show roads with no speed data</label>
    <label><input type="checkbox" id="toggle-shields" checked> Show route signs</label>
    <select id="bookmarks" aria-label="Jump to place" hidden></select>
  </details>

  <div id="status" role="status" hidden></div>

  <script src="vendor/maplibre-gl.js"></script>
  <script src="vendor/pmtiles.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
